<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NEXUS · API 管理终端{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <style>
    /* 浅色科幻风格装饰性元素 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(6, 182, 212, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }
    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.08), 0 0 60px rgba(6, 182, 212, 0.02);
    }
    .glow-cyan-sm {
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.05);
    }
    .glow-cyan-text {
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }
    .border-glow {
      border-color: rgba(6, 182, 212, 0.25);
    }
    .card-glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.15);
    }
    .card-glass:hover {
      border-color: rgba(6, 182, 212, 0.3);
    }
    .input-neon {
      background: #ffffff;
      border: 1px solid rgba(6, 182, 212, 0.25);
      color: #374151;
      transition: all 0.2s;
    }
    .input-neon:focus {
      border-color: rgba(6, 182, 212, 0.6);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.1);
      outline: none;
    }
    .input-neon::placeholder {
      color: rgba(156, 163, 175, 0.6);
    }
    .scan-line {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(6, 182, 212, 0.015) 2px,
        rgba(6, 182, 212, 0.015) 4px
      );
      pointer-events: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(243, 244, 246, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.25);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.4);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-700 min-h-screen relative overflow-x-hidden">
  <!-- 扫描线覆盖（极淡） -->
  <div class="scan-line fixed inset-0 z-[1] pointer-events-none"></div>

  <!-- 顶栏导航 -->
  <nav class="relative z-10 border-b border-cyan-200/50 bg-white/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-14 items-center">
        <a href="/" class="flex items-center gap-3 text-base font-semibold text-gray-800 tracking-wider">
          <span class="flex items-center justify-center w-7 h-7 rounded border border-cyan-400/60 bg-cyan-50 text-cyan-600 glow-cyan-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M8 21 L16 21"/>
              <path d="M12 21 L12 15"/>
              <path d="M12 15 C12 12.5 14 11 16 11 C18 11 20 12.5 20 15"/>
              <path d="M4 6 L20 6"/>
              <path d="M6 6 L6 11 C6 13 8 15 10 15 L12 15"/>
              <path d="M20 6 L20 11 C20 13 18 15 16 15 L12 15"/>
            </svg>
          </span>
          <span class="hidden sm:inline">API密钥管理器</span>
          <span class="sm:hidden">API密钥管理器</span>
          <span class="ml-1 w-1.5 h-1.5 rounded-full bg-cyan-500 animate-pulse opacity-60"></span>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-[11px] tracking-widest text-gray-400 uppercase hidden sm:block">v1.0 · 接口控制面板</span>
          <span class="w-2 h-2 rounded-full bg-emerald-500/70 shadow-[0_0_6px_rgba(52,211,153,0.3)]"></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast 通知 -->
  <div id="toast"
       class="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm
              border border-cyan-300/30 bg-white/90 backdrop-blur-md text-cyan-700 shadow-lg
              opacity-0 translate-y-2 transition-all duration-300 pointer-events-none">
    <svg class="w-4 h-4 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg">已复制到剪贴板</span>
  </div>

  <script>
    // 复制到剪贴板
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        if (toast) {
          toast.classList.remove('opacity-0', 'translate-y-2');
          toast.classList.add('opacity-100', 'translate-y-0');
          setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-2');
          }, 1500);
        }
      });
    }
  </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}API密钥管理器{% endblock %}

{% block content %}
<div class="space-y-6">

  <!-- 统计概览 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="card-glass rounded-xl p-5 glow-cyan">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-lg bg-cyan-100/80 border border-cyan-300/40">
          <svg class="w-5 h-5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
          </svg>
        </div>
        <div>
          <p class="text-[11px] tracking-wider text-gray-500 uppercase">API KEY总数</p>
          <p class="text-2xl font-bold text-gray-800">{{ total }}</p>
        </div>
      </div>
      <div class="mt-2 h-px bg-gradient-to-r from-cyan-400/30 to-transparent"></div>
    </div>

    <div class="card-glass rounded-xl p-5 glow-cyan">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-lg bg-emerald-100/80 border border-emerald-300/40">
          <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </div>
        <div>
          <p class="text-[11px] tracking-wider text-gray-500 uppercase">提供商数</p>
          <p class="text-2xl font-bold text-gray-800">{{ providers|length }}</p>
        </div>
      </div>
      <div class="mt-2 h-px bg-gradient-to-r from-emerald-400/30 to-transparent"></div>
    </div>
  </div>

  <!-- 搜索与筛选 -->
  <div class="card-glass rounded-xl p-4 glow-cyan-sm" id="filter-form">
    <!-- 搜索行 -->
    <div class="flex flex-col sm:flex-row gap-3 mb-3">
      <div class="flex-1">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text"
                 name="search"
                 placeholder="搜索接口名称、地址、模型名或应用..."
                 class="w-full pl-10 pr-4 py-2 input-neon rounded-lg text-sm"
                 hx-get="/api/v1/apis/"
                 hx-trigger="keyup changed delay:300ms"
                 hx-target="#api-table"
                 hx-include="#filter-form">
        </div>
      </div>
      <button onclick="openForm()"
              class="px-4 py-2 bg-cyan-600 text-white text-sm font-medium rounded-lg
                     hover:bg-cyan-500 transition-colors whitespace-nowrap
                     border border-cyan-400/30 shadow-[0_0_12px_rgba(6,182,212,0.2)]">
        + 新增 API
      </button>
    </div>
    <!-- 筛选行：4 个筛选维度 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
      <select name="provider"
              class="px-3 py-2 input-neon rounded-lg text-sm"
              hx-get="/api/v1/apis/"
              hx-trigger="change"
              hx-target="#api-table"
              hx-include="#filter-form">
        <option value="">全部提供商</option>
        {% for p in providers %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
      <input type="text"
             name="model_name"
             placeholder="模型名"
             class="px-3 py-2 input-neon rounded-lg text-sm"
             hx-get="/api/v1/apis/"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#api-table"
             hx-include="#filter-form">
      <input type="text"
             name="name"
             placeholder="名称"
             class="px-3 py-2 input-neon rounded-lg text-sm"
             hx-get="/api/v1/apis/"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#api-table"
             hx-include="#filter-form">
      <input type="text"
             name="app_usage"
             placeholder="所属应用"
             class="px-3 py-2 input-neon rounded-lg text-sm"
             hx-get="/api/v1/apis/"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#api-table"
             hx-include="#filter-form">
    </div>
  </div>

  <!-- 表单区域（新增/编辑），默认隐藏 -->
  <div id="form-container" class="hidden">
    <div id="form-area">
    </div>
  </div>

  <!-- API 表格 -->
  <div class="card-glass rounded-xl overflow-hidden glow-cyan">
    <div id="api-table">
      {% include "fragments/api_table.html" %}
    </div>
  </div>
</div>

<!-- 确认删除模态框 -->
<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center" style="display:none">
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" onclick="hideDeleteModal()"></div>
  <div class="relative bg-white rounded-xl shadow-2xl border border-red-200/60 p-6 w-full max-w-sm mx-4">
    <div class="flex items-center gap-3 mb-4">
      <div class="p-2 rounded-full bg-red-100">
        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-gray-800">确认删除</h3>
        <p class="text-xs text-gray-500 mt-0.5" id="delete-modal-msg">确定要删除此条记录吗？</p>
      </div>
    </div>
    <div class="flex justify-end gap-2">
      <button onclick="hideDeleteModal()"
              class="px-4 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
        取消
      </button>
      <button id="delete-confirm-btn"
              class="px-4 py-2 text-sm text-white bg-red-500 hover:bg-red-400 rounded-lg transition-colors shadow-[0_0_10px_rgba(239,68,68,0.3)]">
        确认删除
      </button>
    </div>
  </div>
</div>

{% block extra_scripts %}
<script>
// 预置提供商配置数据
const PROVIDER_CONFIGS = {{ provider_configs | tojson | safe }};

// 关闭/打开表单
function closeForm() {
  document.getElementById('form-container')?.classList.add('hidden');
}
function openForm(loadUrl) {
  var container = document.getElementById('form-container');
  if (!container) return;
  container.classList.remove('hidden');
  htmx.ajax('GET', loadUrl || '/api/v1/apis/new', { target: '#form-area' });
}

// 切换密钥显隐
function toggleKey(id) {
  var mask = document.getElementById('key-mask-' + id);
  var text = document.getElementById('key-text-' + id);
  if (mask && text) {
    var show = text.style.display !== 'inline';
    text.style.display = show ? 'inline' : 'none';
    mask.style.display = show ? 'none' : 'inline';
  }
}

// HTMX 内容替换后，显式通知 Alpine 初始化新 DOM
document.addEventListener('htmx:afterSwap', function(evt) {
  if (evt.detail.target && evt.detail.target.id === 'form-area') {
    if (typeof Alpine !== 'undefined' && typeof Alpine.initTree === 'function') {
      Alpine.initTree(evt.detail.target);
    }
  }
});

// ---- 删除确认（模态框版，不依赖 confirm()） ----
var _deleteId = null;
var _deleteRow = null;

function showDeleteModal(id, name, btn) {
  _deleteId = id;
  _deleteRow = btn ? btn.closest('tr') : null;
  document.getElementById('delete-modal-msg').textContent = '确定要删除「' + name + '」吗？此操作不可恢复。';
  document.getElementById('delete-modal').style.display = 'flex';
}

function hideDeleteModal() {
  _deleteId = null;
  _deleteRow = null;
  document.getElementById('delete-modal').style.display = 'none';
}

// 确认删除按钮点击事件 — 页面加载时注册一次
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('delete-confirm-btn').addEventListener('click', function() {
    var id = _deleteId;
    if (id === null) return;

    // 动画淡出行
    if (_deleteRow) {
      _deleteRow.style.transition = 'opacity 0.3s';
      _deleteRow.style.opacity = '0';
    }

    hideDeleteModal();

    fetch('/api/v1/apis/' + id, { method: 'DELETE' })
      .then(function(r) {
        if (!r.ok) throw new Error('服务器返回 ' + r.status);
        if (_deleteRow) setTimeout(function() { _deleteRow.remove(); }, 350);
        htmx.ajax('GET', '/api/v1/apis/', { target: '#api-table' });
      })
      .catch(function(e) {
        alert('删除失败：' + e.message);
        if (_deleteRow) _deleteRow.style.opacity = '1';
      });
  });
});
</script>
{% endblock %}
{% endblock %}
